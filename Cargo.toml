[workspace]
resolver = "2"
members = ["draug-proto", "draug-core", "draug-ns", "draug-guest", "draug-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/draug"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
rmp-serde = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
nix = "0.29"
libc = "0.2"
tempfile = "3"
# MCP server SDK (stdio transport). `server` + `macros` are on by default;
# `transport-io` adds the stdio transport used by `sbx mcp`.
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
schemars = "1.0"

draug-proto = { path = "draug-proto" }
draug-core = { path = "draug-core" }
draug-ns = { path = "draug-ns" }
draug-guest = { path = "draug-guest" }
