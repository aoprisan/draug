[package]
name = "draug-ns"
description = "Rootless Linux namespace + overlayfs backend for draug"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
draug-core.workspace = true
draug-proto.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
draug-guest.workspace = true
nix = { workspace = true, features = ["fs", "hostname", "mount", "process", "sched", "signal", "user"] }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
libc.workspace = true

[[test]]
name = "sandbox"
harness = false
