[package]
name = "draug-guest"
description = "Guest agent for draug sandboxes (PID 1 inside the sandbox)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Kept tokio/rusqlite-free: the guest must stay buildable as a small static
# binary (x86_64-unknown-linux-musl). draug-ns links the library and forks
# straight into `guest_main` after namespace setup.

[dependencies]
draug-proto.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs", "mount", "process", "signal"] }
libc.workspace = true
